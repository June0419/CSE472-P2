[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cse472-project2"
version = "0.1.0"
description = "Protecting personal data from LLM training: CSE 472 research project"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
data = ["datasets>=3,<5", "huggingface-hub>=0.30,<1"]
experiment = [
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
  "peft>=0.15,<1",
  "accelerate>=1,<2",
  "datasets>=3,<5",
  "sentence-transformers>=3,<6",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.scripts]
project-check = "cse472_project2.check:main"
project-prepare-data = "cse472_project2.data:main"
project-protect-data = "cse472_project2.protection:main"
project-train = "cse472_project2.train:main"
project-evaluate = "cse472_project2.evaluate:main"
project-visualize = "cse472_project2.visualize:main"
project-pipeline = "cse472_project2.pipeline:main"


[tool.setuptools.packages.find]
where = ["src"]
