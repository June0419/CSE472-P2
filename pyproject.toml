[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cse472-project2"
version = "0.1.0"
description = "Protecting personal data from LLM training: CSE 472 research project"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
experiment = [
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
  "peft>=0.15,<1",
  "accelerate>=1,<2",
  "datasets>=3,<5",
  "sentence-transformers>=3,<6",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.scripts]
project-check = "cse472_project2.check:main"

[tool.setuptools.packages.find]
where = ["src"]
